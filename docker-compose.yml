services:

  backend:
    image: spydy00/backend:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://employee-dbs.cqtoowc80ooe.us-east-1.rds.amazonaws.com:3306/employee_management
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=spydyrathod
      - JWT_SECRET=mysecretkey123
    depends_on:
      - mysql

  frontend:
    image: spydy00/frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: employee_management
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
